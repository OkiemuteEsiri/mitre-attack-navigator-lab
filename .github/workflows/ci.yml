name: defensive-coverage-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic dataset and render report
        run: python -m src.cli data/synthetic_coverage.json --report /tmp/attack-coverage-report.md
